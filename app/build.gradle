plugins {
    id 'com.android.application'
}

// 发布签名配置：keystore/keystore.properties 存在时自动启用（不入库）
def keystorePropsFile = rootProject.file("keystore/keystore.properties")

android {
    namespace 'com.greenhome.musicbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.greenhome.musicbox"
        minSdk 24          // Android 7.0，兼容老人的旧手机
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    if (keystorePropsFile.exists()) {
        signingConfigs {
            release {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // 单一功能小应用，不做混淆，方便排查问题
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true   // Debug 构建里给 EventLogger 调试日志用
    }
}

dependencies {
    // Media3 (ExoPlayer)：官方播放器，内置 Sonic 算法支持“变调不变速”
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    testImplementation "junit:junit:4.13.2"
}
